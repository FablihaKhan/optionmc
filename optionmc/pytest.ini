[pytest]
# Run from this directory (e:\4-1\Numerical\project\optionmc). Do not run pytest
# from the parent directory: `optionmc` there resolves to the repo folder as an
# implicit namespace package and shadows the installed one.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra summarises every non-passing outcome at the end of the run.
addopts = -ra

markers =
    slow: test takes more than a few seconds to run
